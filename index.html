<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>粒子艺术 - 手势互动进阶版</title>
    <style>
        body { margin: 0; overflow: hidden; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        #video { transform: scaleX(-1); position: absolute; width: 160px; opacity: 0.3; bottom: 20px; left: 20px; border-radius: 10px; transition: opacity 0.3s; }
        #video:hover { opacity: 1; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffffee; font-family: "Microsoft YaHei", sans-serif; text-align: center; }
    </style>
</head>
<body>
    <div id="loader" class="loading"><h1>AI 系统启动中...</h1><p>请确保摄像头已开启</p></div>
    <video id="video" playsinline></video>

    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@18.6.4/dist/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        // --- 核心配置 ---
        const CONFIG = {
            count: 5000,
            colors: { palm: 0xffffee, v_sign: 0x88ffaa, fist: 0xff4477 }
        };

        let scene, camera, renderer, points, snow;
        let handPos = new THREE.Vector3(0, 0, 0);
        let lerpPos = new THREE.Vector3(0, 0, 0);
        let currentGesture = 'none';
        let shapes = {};

        // --- 形状点云生成 ---
        function createShapes() {
            const getPoints = (text, size) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 512; canvas.height = 256;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `bold ${size}px "Microsoft YaHei"`;
                ctx.fillStyle = 'white';
                ctx.fillText(text, 256, 128);
                const data = ctx.getImageData(0, 0, 512, 256).data;
                const pts = [];
                for(let i=0; i<data.length; i+=16) { // 步长控制点密度
                    if(data[i+3] > 128) {
                        const x = (i/4 % 512) - 256;
                        const y = 128 - Math.floor(i/4 / 512);
                        pts.push({x: x * 0.08, y: y * 0.08});
                    }
                }
                return pts;
            };

            shapes.palm = getPoints('小力士99', 90);
            shapes.v_sign = getPoints('张呈 雷淞然', 70);
            
            // 玫瑰花心形曲线替代
            const rose = [];
            for(let t=0; t<Math.PI*2; t+=0.01) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                rose.push({x: x * 0.5, y: y * 0.5});
            }
            shapes.fist = rose;
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 粒子系统
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(CONFIG.count * 3);
            for(let i=0; i<pos.length; i++) pos[i] = (Math.random()-0.5) * 60;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.18,
                color: 0xffffee,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            points = new THREE.Points(geo, mat);
            scene.add(points);

            // 背景雪花
            const sGeo = new THREE.BufferGeometry();
            const sPos = new Float32Array(1500);
            for(let i=0; i<1500; i++) sPos[i] = (Math.random()-0.5) * 100;
            sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
            snow = new THREE.Points(sGeo, new THREE.PointsMaterial({size: 0.05, color: 0xffffff, opacity: 0.4, transparent: true}));
            scene.add(snow);

            createShapes();
            setupAI();
            loop();
        }

        function setupAI() {
            const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
            hands.setOptions({maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6});
            hands.onResults(res => {
                document.getElementById('loader').style.display = 'none';
                if(res.multiHandLandmarks && res.multiHandLandmarks[0]) {
                    const lm = res.multiHandLandmarks[0];
                    handPos.x = (0.5 - lm[9].x) * 50;
                    handPos.y = (0.5 - lm[9].y) * 40;

                    // 检测逻辑
                    let nextG = 'none';
                    const isFist = lm[8].y > lm[6].y && lm[12].y > lm[10].y;
                    const isV = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y > lm[14].y;
                    const isPalm = lm[8].y < lm[6].y && lm[20].y < lm[18].y;

                    if(isFist) nextG = 'fist';
                    else if(isV) nextG = 'v_sign';
                    else if(isPalm) nextG = 'palm';

                    if(nextG !== currentGesture && nextG !== 'none') {
                        currentGesture = nextG;
                        // 颜色变换
                        new TWEEN.Tween(points.material.color)
                            .to(new THREE.Color(CONFIG.colors[nextG]), 500)
                            .start();
                    }
                }
            });

            const cam = new Camera(document.getElementById('video'), {
                onFrame: async () => await hands.send({image: document.getElementById('video')}),
                width: 640, height: 480
            });
            cam.start();
        }

        function loop() {
            requestAnimationFrame(loop);
            TWEEN.update();

            // 平滑手部跟随
            lerpPos.lerp(handPos, 0.1);

            const posAttr = points.geometry.attributes.position;
            const target = shapes[currentGesture] || [];
            
            for(let i=0; i<CONFIG.count; i++) {
                const i3 = i * 3;
                let tx, ty, tz;

                if(target[i % target.length]) {
                    const p = target[i % target.length];
                    tx = p.x + lerpPos.x;
                    ty = p.y + lerpPos.y;
                    tz = Math.sin(Date.now()*0.002 + i) * 0.5;
                } else {
                    tx = posAttr.array[i3] + Math.sin(Date.now()*0.001 + i) * 0.01;
                    ty = posAttr.array[i3+1] + Math.cos(Date.now()*0.001 + i) * 0.01;
                    tz = posAttr.array[i3+2];
                }

                posAttr.array[i3] += (tx - posAttr.array[i3]) * 0.08;
                posAttr.array[i3+1] += (ty - posAttr.array[i3+1]) * 0.08;
                posAttr.array[i3+2] += (tz - posAttr.array[i3+2]) * 0.08;
            }
            posAttr.needsUpdate = true;

            // 背景雪花自旋和飘落
            snow.rotation.y += 0.001;
            const sPos = snow.geometry.attributes.position.array;
            for(let i=1; i<sPos.length; i+=3) {
                sPos[i] -= 0.02;
                if(sPos[i] < -40) sPos[i] = 40;
            }
            snow.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        init();
        window.onresize = () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
